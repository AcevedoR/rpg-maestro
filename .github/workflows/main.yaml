name: Release Workflow
on:
  push:
    branches:
      - main

# Needed for nx-set-shas when run on the main branch
permissions:
  actions: read
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      - run: sudo apt-get update
      - run: sudo apt-get install ffmpeg -y

      - run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - uses: nrwl/nx-set-shas@v4

      - name: Release
        id: release
        continue-on-error: true
        run: npx nx affected -t lint test deploy --no-cloud --parallel=false

      # semantic-release pushes the release tag, then refs/notes/semantic-release as its very last
      # step; GitHub sometimes rejects that notes push when several apps release seconds apart.
      # docker-build/deploy read the version from the tag on HEAD (devtools/release/docker-release.sh),
      # so a second pass finishes such a release. A real lint/test/build failure fails here again.
      - name: Release (retry)
        if: steps.release.outcome == 'failure'
        run: npx nx affected -t lint test deploy --no-cloud --parallel=false

  trigger-deploy:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - run: curl -f ${{ vars.DEPLOY_WEBHOOK }}
